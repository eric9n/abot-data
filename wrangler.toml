# abot-data Worker.
#
# This file is for local development only. Production is published solely by
# the Cloudflare Workers Builds trigger, which runs deploy/cloudflare.mjs to
# generate dist/wrangler.json (real D1 database_id, Durable Object, service
# binding, cron, queue consumers). A plain `wrangler deploy` of this file is
# not a supported deploy path. See deploy/ENV.md.
#
# Production secrets live in the Worker's dashboard settings and must never
# enter this repository: DATA_MCP_TOKEN, SUBSCRIPTION_SEAL, and the others
# listed in deploy/ENV.md.

name = "abot-data"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Binding name is DB. database_id is a placeholder; the deployer injects the real id.
[[d1_databases]]
binding = "DB"
database_name = "abot-data"
database_id = "00000000-0000-0000-0000-000000000000"

# Queue producers only. Consumers are part of the deploy contract, not this file.
[[queues.producers]]
binding = "DELIVER_QUEUE"
queue = "abot-deliver"

[[queues.producers]]
binding = "RULE_EVENTS"
queue = "rule-events"

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Scheduler"]

# Scheduler hands due triggers back to this Worker through SELF.
[[services]]
binding = "SELF"
service = "abot-data"

[observability]
enabled = true
